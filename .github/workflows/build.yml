name: Sentinel Shield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html && test -s dist/index.html

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-shield-dist
          path: dist/
          if-no-files-found: error
