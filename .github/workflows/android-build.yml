name: Sentinel Shield Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build native Android debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-shield-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_SHA::7}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Sentinel Shield Android ${GITHUB_SHA::7}" \
            --notes "Verified debug APK built by GitHub Actions from commit $GITHUB_SHA."
